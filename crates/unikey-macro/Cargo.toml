[package]
name = "unikey-macro"
version = "0.1.0"
edition = "2021"
authors = ["UniKey Rust Team"]
description = "Macro system for UniKey Rust - user-defined text replacements"
license = "MIT"
repository = "https://github.com/unikey-rust/unikey-rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }