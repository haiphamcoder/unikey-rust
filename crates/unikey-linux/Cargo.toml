[package]
name = "unikey-linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Linux platform integration for UniKey (XIM, Wayland, GTK)"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }

# Platform-specific dependencies (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
x11 = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
gtk4 = { workspace = true, optional = true }

# Internal dependencies
unikey-core = { path = "../unikey-core" }
unikey-platform-common = { path = "../unikey-platform-common" }

[features]
default = ["xim"]
xim = ["dep:x11"]
wayland = ["dep:wayland-client", "dep:wayland-protocols"]
gtk4 = ["dep:gtk4"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
