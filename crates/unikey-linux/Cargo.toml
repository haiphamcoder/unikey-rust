[package]
name = "unikey-linux"
version = "0.1.0"
edition = "2021"
authors = ["UniKey Rust Team"]
description = "Linux XIM integration for UniKey Rust - X Input Method server implementation"
license = "MIT"
repository = "https://github.com/unikey-rust/unikey-rust"

[dependencies]
unikey-core = { path = "../unikey-core" }
unikey-input-methods = { path = "../unikey-input-methods" }
unikey-encoding = { path = "../unikey-encoding" }
unikey-macro = { path = "../unikey-macro" }
unikey-spell = { path = "../unikey-spell" }

# X11 and XIM dependencies (optional for now)
# x11 = "2.21"
# x11-dl = "2.20"
# xcb = "1.3"
# xcb-imdkit = "0.1"

# Async and threading
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Error handling and logging
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# System integration
libc = "0.2"
nix = "0.27"

[dev-dependencies]
tokio-test = "0.4"